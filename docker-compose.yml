services:
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockpuzzle-celery-worker
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://YOUR_DROPLET_IP:6379/0
    restart: always
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=1"
      ]

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockpuzzle-celery-beat
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://YOUR_DROPLET_IP:6379/0
    restart: always
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "beat",
        "--loglevel=info"
      ]